<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Contact Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Task 0</a>
        <a href="validation.html">Task 1</a>
        <a href="bootstrap.html">Task 2</a>
        <a href="feedback.html">Task 3</a>
        <a href="registration.html">Task 4</a>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Bootstrap Contact Form</h1>

        <form class="row g-3 bootstrap-form">
            <div class="col-md-6">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" placeholder="Enter your first name">
            </div>

            <div class="col-md-6">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" placeholder="Enter your last name">
            </div>

            <div class="col-12">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="example@gmail.com">
                <div class="form-text">We will not share your email with anyone.</div>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" placeholder="Write your message here"></textarea>
            </div>

            <div class="col-12">
                <button type="submit" class="btn submit-btn">Submit</button>
            </div>
        </form>
    </div>

</body>
</html>
