<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html">Task 0</a>
        <a href="validation.html">Task 1</a>
        <a href="bootstrap.html">Task 2</a>
        <a href="feedback.html">Task 3</a>
        <a href="registration.html">Task 4</a>
    </nav>

    <div class="container mt-5">
        <h1 class="text-center mb-4">Bootstrap Form Validation</h1>

        <form id="contactForm" class="row g-3 bootstrap-form" novalidate>
            <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Name is required.</div>
            </div>

            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Please enter a valid email.</div>
            </div>

            <div class="col-12">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" rows="5" required></textarea>
                <div class="valid-feedback">Looks good!</div>
                <div class="invalid-feedback">Message is required.</div>
            </div>

            <div class="col-12">
                <button type="submit" class="btn submit-btn">Submit</button>
            </div>
        </form>
    </div>

    <script src="feedback.js"></script>
</body>
</html>
